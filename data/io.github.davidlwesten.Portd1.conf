<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="portd">
    <allow own="io.github.davidlwesten.Portd1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.davidlwesten.Portd1"/>
  </policy>
</busconfig>
